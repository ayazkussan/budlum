name: BudFly

# Crate-scoped validation for `crates/budfly` (connectome-native provable
# neuromorphic substrate; see docs/BUDFLY.md). Kept separate from ci.yml on
# purpose: the crate is zero-dependency and standalone, so its gate is small,
# fast (~2 min) and fails loudly on its own page instead of being lost in a
# 2,000-line matrix. Same conventions as the other workflows: pinned action
# SHAs, dtolnay toolchain, rust-cache, least-privilege permissions.
#
# Diagnostics discipline: when a gate step fails on a pull_request, its full
# output is posted back to the PR as a comment (pull-requests: write exists
# ONLY for that), so the failure is actionable from the PR itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: budfly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt-apply:
    # TEMPORARY (removed once the gate is green): applies rustfmt in CI and
    # commits the result back, because sandbox egress rules make runner logs
    # and artifacts unreadable from some review environments. The gate job
    # remains the source of truth; this job only repairs formatting.
    name: temp - apply rustfmt in CI
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # default: persist-credentials (this job must push back)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: cargo fmt + commit if drifted
        run: |
          cargo fmt --manifest-path crates/budfly/Cargo.toml --all
          git config user.email "budfly-ci@users.noreply.github.com"
          git config user.name "budfly-ci"
          git add -A
          if git diff --cached --quiet; then
            echo "already formatted"
          else
            git commit -m "chore(budfly): cargo fmt applied in CI" 2>&1 | tail -2
            git push 2>&1 | tail -2
          fi

  gate:
    name: fmt + clippy + tests + goldens + example
    needs: fmt-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budfly

      # House panic gate: clippy with the crate-level lint table
      # (unwrap_used/expect_used = deny) under the same -D warnings flag the
      # root crate lives under.
      - name: gate steps (fmt, clippy, tests, example, python reference)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          report_failure() {
            local name="$1" out="$2"
            # Channel A: PR comment (best effort).
            if [ -n "${PR_NUMBER}" ]; then
              if ! printf '**BudFly gate `%s` FAILED**\n\n```\n%.60000s\n```\n' "${name}" "${out}" \
                | gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file -; then
                echo "::warning::PR comment channel failed for ${name}"
              fi
            fi
            # Channel B: checks annotations (readable via the Checks API).
            echo "${out}" | head -40 | while IFS= read -r line; do
              echo "::error::[${name}] ${line}"
            done
            printf '%s\n' "${out}" | tail -60
            echo "::error::${name} failed"
          }
          run_step() {
            local name="$1"; shift
            local out
            out=$("$@" 2>&1)
            local code=$?
            if [ ${code} -ne 0 ]; then
              report_failure "${name}" "${out}"
              exit 1
            fi
            echo "[gate] ${name}: OK"
          }
          run_step "fmt"      cargo fmt --manifest-path crates/budfly/Cargo.toml --all -- --check
          run_step "clippy"   cargo clippy --manifest-path crates/budfly/Cargo.toml --all-targets -- -D warnings
          run_step "tests"    cargo test --manifest-path crates/budfly/Cargo.toml
          run_step "example"  cargo run --manifest-path crates/budfly/Cargo.toml --example fly_chip_report
          # The Python reference is the provenance oracle: it recomputed every
          # golden anchor committed in tests/goldens.rs. If this passes while the
          # Rust tests pass, the two implementations agree bit-for-bit.
          run_step "python-reference" python3 crates/budfly/scripts/reference_check.py

  determinism-smoke:
    # Determinism is not just a unit property here, it is the product: compile
    # twice is unnecessary (no build inputs), but the golden anchors must hold
    # on a second, pristine runner with a cold cache as well.
    name: goldens on a cold runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - name: golden anchors reproduce cold
        run: cargo test --manifest-path crates/budfly/Cargo.toml --test goldens
